<body>
    <nav>
        <div class="container">
            <a href="/">
                <div class="logo">
                    <i class="uil uil-layer-group"></i>
                    <h2 class="thetext">Forum 01</h2>
                </div>
            </a>
            <div class="options">
                <div>
                    <form action="/register" method="POST">
                        <input type="submit" class="button signin" name="submit" value="Sign Up">
                    </form>
                </div>
                <div>
                    <form action="/login" method="POST">
                        <input type="submit" class="button register" name="submit" value="Sign In">
                    </form>
                </div>
                <!-- <a href="/templates/login.html" >Sign IN</a>
                <a href="/templates/register.html" >Register</a> -->
            </div>
        </div>
    </nav>

    <div class="body-container">
        <div class="login-decoration-container">
            <div class="human">
                <h1>Sign In To Join Us</h1>
                <!-- <img src="/static/images/pexels-andrea-piacquadio-3764402.jpg" alt="" style="background-size: contain; width: 100%; height: 100%;"> -->
            </div>
            <div></div>
            <div></div>
        </div>

        <div class="login-card-container">
            <div class="login-card">
                <form class="login-card-form" action="/" method="POST">
                    <div class="form-item email-field">
                        <i class="uil uil-user user-icon"></i>
                        <input type="text" name="Email" placeholder="Email" class="email-input" id="email-input" required>
                    </div>
                    <div class="form-item password-field">
                        <div class="password-overlay" id="password-overlay"> </div>
                        <i class="uil uil-lock password-lock-icon"></i>
                        <input type="password" name="Mdp" placeholder="Password..." class="password-input" id="password-input" required>
                        <i class="uil uil-eye-slash toggle-visibility-icon"></i>
                    </div>
                    <div>
                        {{range .}}
                        <p>{{.Error}}</p>
                        {{end}}
                    </div>
                    <!-- <div class="form-item-other">
                        <a href="#">I forgot my password!</a>
                    </div> -->
                    <input class="thesignin" type="submit" name="submit" value="Sign In">
                </form>
                <!-- <div class="login-card-footer">
                    Don't have an account? <a href="#">Create a free account.</a>
                </div> -->
